generations:
  - name: "First Generation (Pre-Facelift)"
    start_year: 2004
    end_year: 2007
    description: "The Volvo V50 was the station wagon version of the Volvo S40 small family car, first unveiled at the 2003 Bologna Motor Show. Built on the Ford Global C-car Platform shared with the second-generation European Ford Focus and Mazda3, the V50 featured Volvo's innovative 'floating' center console design and interior 'theatre' lighting. The pre-facelift model featured the original front styling with a more traditional Volvo grille design. Powertrain options included four-cylinder petrol engines (1.6L, 1.8L, 2.0L, 2.4L) and five-cylinder units including the naturally aspirated 2.4i and the turbocharged T5 producing approximately 220 horsepower. Diesel options were available in Europe, including the 2.0D and D5 turbocharged diesel engines. All-wheel drive was available on T5 models. Safety remained a Volvo hallmark with the Side Impact Protection System and Whiplash Protection System. The pre-facelift V50 represented a complete redesign from the previous V40, offering more modern styling while maintaining Volvo's family wagon heritage."
  - name: "First Generation (Facelift)"
    start_year: 2008
    end_year: 2012
    description: "For the 2008 model year, the Volvo V50 received a significant facelift with revised front styling featuring a more modern grille and bumper design, along with minor interior modifications. The T5 engine received increased power and torque output. New options included active xenon headlights and updated audio systems. A six-speed manual transmission became available along with a new 1.8 Flexifuel engine capable of running on E85 ethanol. The D5 diesel engine became available with this update. In North America, the 2011 model year was the last for the V50, with production continuing in Belgium until December 2012. Total production reached 519,007 units from 2003 to 2012. The facelifted V50 maintained its reputation for safety while offering updated technology and more refined styling, appealing to families seeking a premium compact wagon with contemporary design."
